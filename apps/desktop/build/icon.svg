<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- сітка плану -->
  <g stroke="#93c5fd" stroke-opacity="0.12" stroke-width="4">
    <path d="M192 128V896M352 128V896M512 128V896M672 128V896M832 128V896"/>
    <path d="M128 192H896M128 352H896M128 512H896M128 672H896M128 832H896"/>
  </g>
  <!-- ортогональні траси -->
  <g fill="none" stroke="#38bdf8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M192 832V672H352V512H512"/>
    <path d="M832 832V672H672V512H512"/>
    <path d="M192 192H352V352H512"/>
  </g>
  <g fill="#0b1220" stroke="#38bdf8" stroke-width="22">
    <circle cx="192" cy="832" r="30"/>
    <circle cx="832" cy="832" r="30"/>
    <circle cx="192" cy="192" r="30"/>
  </g>
  <!-- блискавка -->
  <path filter="url(#glow)" fill="url(#bolt)" stroke="#fff7d1" stroke-width="10" stroke-linejoin="round"
        d="M590 120 L330 560 H494 L430 904 L720 440 H548 Z"/>
