appId: com.voltgrid.app
productName: VoltGrid
directories:
  output: release
  buildResources: build
files:
  - main.cjs
  - build/icon.png
  - dist-web/**
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: VoltGrid-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  executableName: voltgrid
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  syncDesktopName: true
  maintainer: VoltGrid
  artifactName: VoltGrid-${version}-linux-${arch}.${ext}
